name: Auto release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Walks history oldest -> newest. For every commit that introduces a
      # manifest version without a matching tag, builds the zip/mcpack from
      # that commit's files and publishes a release. Already released
      # versions are skipped, so this is safe to re-run.
      - name: Release every unreleased version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for sha in $(git rev-list --reverse HEAD); do
            VERSION=$(git show "$sha:ZephyCubeRecipe/manifest.json" 2>/dev/null \
              | jq -r '.header.version | map(tostring) | join(".")') || continue
            [ -n "$VERSION" ] || continue
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              continue
            fi
            echo "Releasing $TAG from $sha"
            rm -rf build && mkdir -p build/src && git archive "$sha" | tar -x -C build/src
            NAME="ZephyCubeRecipe-$TAG"
            (cd build/src && zip -qr "../$NAME.zip" ZephyCubeRecipe)
            (cd build/src/ZephyCubeRecipe && zip -qr "../../$NAME.mcpack" .)
            if ! gh release create "$TAG" "build/$NAME.zip" "build/$NAME.mcpack" \
              --target "$sha" --title "ZephyCubeRecipe $TAG" --generate-notes; then
              # GITHUB_TOKEN may not tag a commit that adds .github/workflows files.
              # Retry on a snapshot commit with identical pack files minus .github.
              echo "Retrying $TAG on a workflow-free snapshot commit"
              export GIT_AUTHOR_NAME=github-actions GIT_AUTHOR_EMAIL=actions@github.com
              export GIT_COMMITTER_NAME=github-actions GIT_COMMITTER_EMAIL=actions@github.com
              IDX=$(mktemp -u)
              GIT_INDEX_FILE=$IDX git read-tree "$sha"
              GIT_INDEX_FILE=$IDX git rm -rqf --cached .github
              TREE=$(GIT_INDEX_FILE=$IDX git write-tree)
              PARENT=$(git rev-parse -q --verify "$sha^" || true)
              SNAP=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "ZephyCubeRecipe $TAG (release snapshot)")
              git push origin "$SNAP:refs/tags/$TAG"
              gh release create "$TAG" "build/$NAME.zip" "build/$NAME.mcpack" \
                --title "ZephyCubeRecipe $TAG" --generate-notes
            fi
          done
